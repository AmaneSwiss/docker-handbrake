# Define software versions.
ARG HANDBRAKE_VERSION=1.11.2
ARG UBUNTU_VERSION=24.04
ARG BASEIMAGE_VERSION=4
ARG DVDCSS_VERSION=1.6.0-1-1

ARG HANDBRAKE_VERSION_TAG=""
ARG HANDBRAKE_GIT_URL="https://github.com/HandBrake/HandBrake.git"

ARG HANDBRAKE_DOCKER_VERSION_TAG=""
ARG HANDBRAKE_DOCKER_GIT_URL="https://github.com/jlesage/docker-handbrake.git"

##################################################
# builder: Build HandBrake with NVENC/NVDEC
##################################################
FROM ubuntu:${UBUNTU_VERSION} AS builder

ARG BASEIMAGE_VERSION
ARG DVDCSS_VERSION
ARG UBUNTU_VERSION

ARG HANDBRAKE_VERSION
ARG HANDBRAKE_VERSION_TAG
ARG HANDBRAKE_GIT_URL

ENV DEBIAN_FRONTEND=noninteractive \
    HANDBRAKE_DEBUG_MODE=none

# Prepare base system
RUN apt-get update && apt-get install -y \
  ca-certificates \
  locales \
  locales-all
RUN update-ca-certificates \
 && sed -i 's/^# *\(en_US.UTF-8\)/\1/' /etc/locale.gen \
 && locale-gen \
 && update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8

# Build toolchain
RUN apt-get install -y \
  appstream \
  autoconf \
  automake \
  build-essential \
  clang \
  cmake \
  coreutils \
  curl \
  diffutils \
  file \
  git \
  m4 \
  make \
  meson \
  nasm \
  ninja-build \
  patch \
  pkg-config \
  python3 \
  python3-mesonpy \
  software-properties-common \
  tar \
  xz-utils

# Codec and media build libraries
RUN apt-get install -y \
  libass-dev \
  libbz2-dev \
  libfontconfig-dev \
  libfreetype-dev \
  libfribidi-dev \
  libharfbuzz-dev \
  libjansson-dev \
  liblzma-dev \
  libmp3lame-dev \
  libnuma-dev \
  libogg-dev \
  libopus-dev \
  libsamplerate0-dev \
  libspeex-dev \
  libssl-dev \
  libtheora-dev \
  libtool \
  libtool-bin \
  libturbojpeg0-dev \
  libvorbis-dev \
  libvpx-dev \
  libx264-dev \
  libx265-dev \
  libxml2-dev \
  zlib1g-dev

# Intel QSV and GTK GUI build dependencies
RUN apt-get install -y \
  adwaita-icon-theme \
  desktop-file-utils \
  gettext \
  gstreamer1.0-libav \
  gstreamer1.0-plugins-good \
  libdrm-dev \
  libgstreamer-plugins-base1.0-dev \
  libgtk-4-dev \
  libmfx-gen-dev \
  libnotify4 \
  libva-dev \
  libvpl-dev \
  pciutils \
  x11-utils

RUN apt-get upgrade -y

# Download HandBrake sources
WORKDIR /build
RUN if [ -n "${HANDBRAKE_VERSION_TAG}" ]; then \
      git clone --branch "${HANDBRAKE_VERSION_TAG}" "${HANDBRAKE_GIT_URL}"; \
    else \
      git clone "${HANDBRAKE_GIT_URL}"; \
    fi

# Compile HandBrake with Nvidia NVENC/NVDEC + Intel QSV + AMD VCE
WORKDIR /build/HandBrake
RUN ./scripts/repo-info.sh > version.txt
RUN ./configure --prefix=/usr/local \
                --debug=${HANDBRAKE_DEBUG_MODE} \
                --enable-fdk-aac \
                # --enable-libdovi \
                --enable-numa \
                --enable-nvdec \
                --enable-nvenc \
                --enable-qsv \
                --enable-vce \
                --enable-x265 \
                --launch-jobs=$(nproc) \
                --launch
RUN make -j$(nproc) --directory=build install

##################################################
# base: Runtime image — jlesage baseimage-gui
##################################################
FROM jlesage/baseimage-gui:ubuntu-${UBUNTU_VERSION}-v${BASEIMAGE_VERSION} AS base

ARG BASEIMAGE_VERSION
ARG DVDCSS_VERSION
ARG UBUNTU_VERSION

ARG HANDBRAKE_VERSION
ARG HANDBRAKE_DOCKER_VERSION_TAG
ARG HANDBRAKE_DOCKER_GIT_URL

ARG MAINTAINER="amaneswiss"

LABEL maintainer="${MAINTAINER}"
LABEL org.opencontainers.image.authors="${MAINTAINER}"
LABEL org.opencontainers.image.source="https://hub.docker.com/r/${MAINTAINER}/handbrake?tag=${HANDBRAKE_VERSION}-${UBUNTU_VERSION}"

ENV NVIDIA_VISIBLE_DEVICES=all \
    NVIDIA_DRIVER_CAPABILITIES=all \
    DEBIAN_FRONTEND=noninteractive

ENV APP_NAME="HandBrake" \
    APP_VERSION="${HANDBRAKE_VERSION}" \
    DOCKER_IMAGE_VERSION="${UBUNTU_VERSION}-v${BASEIMAGE_VERSION}" \
    DOCKER_IMAGE_PLATFORM="ubuntu/amd64"

ENV AUTOMATED_CONVERSION_PRESET="Hardware/H.265 NVENC 1080p"

# libdvd-pkg from Debian contrib (Ubuntu does not ship libdvdcss)
ENV DVDCSS_NAME="libdvd-pkg_${DVDCSS_VERSION}_all.deb" \
    DVDCSS_URL="https://ftp.debian.org/debian/pool/contrib/libd/libdvd-pkg/libdvd-pkg_${DVDCSS_VERSION}_all.deb"

ENV APP_ICON_URL="https://raw.githubusercontent.com/jlesage/docker-templates/master/jlesage/images/handbrake-icon.png"

# Set display name
RUN set-cont-env APP_NAME "HandBrake ${HANDBRAKE_VERSION}"

# Generate and install favicons
RUN install_app_icon.sh "${APP_ICON_URL}"

# Create system groups expected by some services
RUN groupadd -r messagebus 2>/dev/null || true \
 && groupadd -r crontab 2>/dev/null || true

# Prepare runtime base
RUN apt-get update && apt-get install -y \
  ca-certificates \
  locales \
  locales-all
RUN update-ca-certificates \
 && sed -i 's/^# *\(en_US.UTF-8\)/\1/' /etc/locale.gen \
 && locale-gen \
 && update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8

# jlesage/baseimage-gui >= 4.12 links /var/log -> /config/log.
# Ensure target exists so systemd postinst can create /var/log/journal.
RUN mkdir -p /config/log

# Watchfolder and management runtime tools
RUN apt-get install -y \
  bash \
  coreutils \
  curl \
  expect \
  findutils \
  git \
  lsscsi \
  tcl \
  wget \
  x11-utils \
  yad

# Handbrake dependencies
# FFmpeg shared libs
RUN apt-get install -y --no-install-recommends \
  libavcodec60 \
  libavdevice60 \
  libavfilter9 \
  libavformat60 \
  libavutil58 \
  libsdl2-2.0-0 \
  libswresample4 \
  libswscale7

# Additional media/codec runtime libs
RUN apt-get install -y --no-install-recommends \
  libass9 \
  libbluray2 \
  libdvdnav4 \
  libdvdread8t64 \
  libjansson4 \
  libnuma1 \
  libsamplerate0 \
  libsvtav1enc1d1 \
  libtheora0 \
  libturbojpeg \
  libvorbis0a \
  libvorbisenc2 \
  libvpx9 \
  libx264-164 \
  libx265-199 \
  libxml2

# Intel QSV runtime
RUN apt-get install -y --no-install-recommends \
  libdrm2 \
  libva-drm2 \
  libva2 \
  libmfx1 \
  libvpl2 \
  i965-va-driver \
  intel-media-va-driver-non-free

# GStreamer runtime
RUN apt-get install -y --no-install-recommends \
  libgstreamer-plugins-base1.0-0 \
  libgstreamer1.0-0

# GUI dependencies
RUN apt-get install -y --no-install-recommends \
  adwaita-icon-theme \
  libcairo2 \
  libgdk-pixbuf-2.0-0 \
  libglib2.0-0t64 \
  libgtk-3-0t64 \
  libgtk-4-1 \
  libnotify4 \
  libpango-1.0-0 \
  pciutils

# Utility tools
RUN apt-get install -y \
  bash-completion \
  cron \
  htop \
  iputils-ping \
  lsof \
  mediainfo \
  nano \
  net-tools \
  tree \
  vim

# Install libdvdcss via libdvd-pkg (decrypts commercial DVDs)
RUN wget "${DVDCSS_URL}" \
 && apt-get install -y "./${DVDCSS_NAME}" \
 && rm "${DVDCSS_NAME}"

# Clone jlesage docker-handbrake rootfs (startup scripts, presets, watchfolder)
RUN if [ -n "${HANDBRAKE_DOCKER_VERSION_TAG}" ]; then \
      git clone --branch "${HANDBRAKE_DOCKER_VERSION_TAG}" "${HANDBRAKE_DOCKER_GIT_URL}" ; \
    else \
      git clone "${HANDBRAKE_DOCKER_GIT_URL}" ; \
    fi
RUN cp -a ./docker-handbrake/rootfs/. / \
 && rm -Rf ./docker-handbrake

# Container initialization scripts (watchfolder, automated conversion)
COPY rootfs/etc/cont-init.d/10-set-locale.sh /etc/cont-init.d/
COPY rootfs/etc/services.d/autovideoconverter/run /etc/services.d/autovideoconverter/
RUN chmod '0755' /etc/cont-init.d/* /etc/services.d/autovideoconverter/run

# Cleanup apt cache
RUN apt-get remove git --purge -y \
 && apt-get autoremove --purge -y \
 && apt-get clean -y \
 && rm -Rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

# Copy compiled HandBrake binaries from builder
COPY --from=builder /usr/local /usr

# Healthcheck
HEALTHCHECK --interval=10s --timeout=3s --start-period=30s --retries=3 \
  CMD (/usr/bin/curl -sSf "127.0.0.1:${WEB_LISTENING_PORT}" >/dev/null && echo "PORT ${WEB_LISTENING_PORT} OK") || exit 1

# Mountable directories
VOLUME ["/config"]
VOLUME ["/output"]
VOLUME ["/storage"]
VOLUME ["/trash"]
VOLUME ["/watch"]
